<title>访问看板 · 功能全树热力图</title>
<style>
:root{color-scheme:light;--bg:#F4F5F7;--surface:#fff;--line:#E3E5EA;--line-strong:#D1D5DD;--ink:#0E1116;--muted:#5A6270;--faint:#666D7A;--accent:#F0561B;--accent-deep:#B93D09;--r-lg:14px;--r-md:10px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#FFFFFF 0%,#F4F5F7 55%,#EDEFF3 100%);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 1px 2px rgba(14,17,22,.05),0 24px 60px -40px rgba(14,17,22,.5)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center}
.brand b{font-size:12.5px;letter-spacing:.12em;font-weight:750}
.brand b em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:8px}
h1{font-size:23px;line-height:1.3;letter-spacing:-.02em;margin:0 0 8px;font-weight:750}
p.lede{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 24px}
label{display:block;font-size:12.5px;font-weight:650;color:#333A45;margin-bottom:8px}
input{width:100%;height:46px;padding:0 14px;font:inherit;font-size:15px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(14,17,22,.08)}
button{width:100%;height:46px;margin-top:14px;border:0;border-radius:var(--r-md);background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:650;letter-spacing:.01em;cursor:pointer;transition:background .15s}
button:hover{background:#22272F}
button:disabled{opacity:.6;cursor:default}
.err{margin:12px 0 0;min-height:20px;font-size:12.5px;color:#A3281C}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
@media(max-width:420px){.card{padding:24px}h1{font-size:20px}}
</style>
</head>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function show(html){ document.open(); document.write(html); document.close(); }
  async function unlock(pw){
    var d = JSON.parse($('payload').textContent);
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(d.s), iterations:d.i, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(d.v2)}, key, b64(d.c));
    return new TextDecoder().decode(plain);
  }
  var saved = null;
  try { saved = sessionStorage.getItem('ys-heatmap'); } catch(e){}
  if (saved) { show(saved); }
  $('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = $('go'); btn.disabled = true; btn.textContent = '正在解密…'; $('err').textContent = '';
    try {
      var html = await unlock($('pw').value);
      try { sessionStorage.setItem('ys-heatmap', html); } catch(e){}
      show(html);
    } catch(e) {
      $('err').textContent = '密码不正确，或内容解密失败。';
      btn.disabled = false; btn.textContent = '进入看板';
    }
  });
})();
</script>
