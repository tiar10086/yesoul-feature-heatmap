<title>访问看板 · 功能全树热力图</title>
<style>
:root{color-scheme:dark;--bg:#0E0F11;--surface:#1A1C20;--surface-2:#16181B;--line:#2B2E35;--line-strong:#3A3E47;--ink:#F4F5F6;--muted:#A1A5AD;--faint:#8A909C;--accent:#C8FF2E;--accent-deep:#A6D417;--on-accent:#0E0F11;--r-lg:6px;--r-md:6px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1100px 560px at 78% -12%,rgba(73,30,137,.55),transparent 62%),radial-gradient(900px 460px at 10% -10%,rgba(51,15,107,.45),transparent 60%),#0E0F11;color:var(--ink);font:14px/1.6 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:32px;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:32px;top:0;width:120px;height:3px;background:var(--accent);transform:skewX(-8deg);transform-origin:left center}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand b{font-size:12.5px;letter-spacing:.12em;font-weight:750}
.brand b em{font-style:normal;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:8px}
h1{font-size:25px;line-height:1.25;letter-spacing:-.045em;margin:0 0 8px;font-weight:900;font-style:italic}
p.lede{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 24px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
input{width:100%;height:46px;padding:0 14px;font:inherit;font-size:15px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,255,46,.18)}
button{width:100%;height:46px;margin-top:14px;border:0;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font:inherit;font-size:14px;font-weight:800;letter-spacing:.01em;cursor:pointer;transition:background .15s,transform .12s}
button:hover{background:var(--accent-deep)}
button:active{transform:scale(.99)}
button:disabled{opacity:.6;cursor:default}
.err{margin:12px 0 0;min-height:20px;font-size:12.5px;color:#FF6B6B}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.lede{color:var(--muted)}
@media(max-width:420px){.card{padding:24px}h1{font-size:20px}}
</style>
</head>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function show(html){ document.open(); document.write(html); document.close(); }
  async function unlock(pw){
    var d = JSON.parse($('payload').textContent);
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(d.s), iterations:d.i, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(d.v2)}, key, b64(d.c));
    return new TextDecoder().decode(plain);
  }
  window.addEventListener('load', function(){
    var saved = null;
    try { saved = sessionStorage.getItem('ys-heatmap'); } catch(e){}
    if (saved) { show(saved); }
  });
  $('f').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = $('go'); btn.disabled = true; btn.textContent = '正在解密…'; $('err').textContent = '';
    try {
      var html = await unlock($('pw').value);
      try { sessionStorage.setItem('ys-heatmap', html); } catch(e){}
      show(html);
    } catch(e) {
      $('err').textContent = '密码不正确，或内容解密失败。';
      btn.disabled = false; btn.textContent = '进入看板';
    }
  });
})();
</script>
